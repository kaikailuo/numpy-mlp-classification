[run]
name = "c_drop"
label = "CIFAR-10 Dropout=0.2"
output_root = "results/formal_v1_1"

[data]
name = "cifar10"
root = "data/raw/cifar10"
split_seed = 20261011
val_size = 5000
preprocess = "channel_standardize"

[model]
dims = [3072, 256, 128, 10]
hidden_activation = "relu"
hidden_init = "kaiming_normal"
output_init = "xavier_normal"
dropout = 0.2
init_seed = 42
dropout_seed = 44

[loss]
name = "cross_entropy"
l1_lambda = 0.0
l2_lambda = 0.0

[optimizer]
name = "sgd"
learning_rate = 0.01

[training]
epochs = 15
batch_size = 128
shuffle_seed = 43
selection = "val_accuracy_then_val_ce"
checkpoint_best = true

[compute]
dtype = "float32"
backend = "cpu"
