[run]
name = "mnist_adam_lr0.003"
label = "O-ADAM: lr=0.003"
output_root = "results"
[data]
name = "mnist"
root = "data/raw/mnist"
split_seed = 20261011
val_size = 5000
preprocess = "scale01"
[model]
dims = [784, 128, 64, 10]
dropout = 0.0
init_seed = 42
dropout_seed = 44
[loss]
name = "cross_entropy"
l1_lambda = 0.0
l2_lambda = 0.0
[optimizer]
name = "adam"
learning_rate = 0.003
beta1 = 0.9
beta2 = 0.999
eps = 1e-8
[training]
epochs = 12
batch_size = 128
shuffle_seed = 43
selection = "val_accuracy_then_val_ce"
checkpoint_best = true
[compute]
dtype = "float32"
backend = "cpu"

