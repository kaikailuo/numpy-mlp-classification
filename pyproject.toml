[project]
name = "a1-numpy-mlp"
version = "1.0.0"
description = "Reproducible NumPy-only MLP experiments for MNIST and CIFAR-10"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.1,<3",
  "matplotlib>=3.9,<4",
]

[project.scripts]
a1-mlp = "a1_mlp.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/a1_mlp"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

